name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format
        run: ruff format --check src tests

      - name: Typecheck
        run: mypy

      - name: Test
        run: pytest

  # Design rule 1 says the core must run without OR-Tools. That claim is only
  # worth anything if something installs the package without it and imports.
  core-without-solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Core imports cleanly and ortools is genuinely absent
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("ortools") is None, "ortools leaked into a core install"
          import planreplan.domain, planreplan.cpm, planreplan.monitor, planreplan.repair, planreplan.io, planreplan.cli
          print("core imports clean without ortools")
          PY
